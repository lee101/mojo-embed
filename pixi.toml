[workspace]
authors = ["Lee Penkman <leepenkman@gmail.com>"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "mojo-embed"
platforms = ["linux-64"]
version = "0.1.0"
license = "MIT"

[tasks]
test = "mkdir -p build && mojo build tests/test_embed.mojo -I src -o build/test_embed && build/test_embed && mojo build --emit shared-lib src/embed/capi.mojo -I src -o build/libmojo_embed.so && python tests/test_capi.py"
bench = "flock /tmp/mojo-bench.lock bash -c 'mkdir -p build && mojo build --emit shared-lib src/embed/capi.mojo -I src -o build/libmojo_embed.so && python bench/bench.py'"

[dependencies]
mojo = "==1.0.0b3.dev2026072406"
numpy = ">=2.0,<3"
python = ">=3.12,<3.14"
